name: Frontend CI/CD

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Docker Image
        run: |
          docker build -t kanavenavamshi/frontend:latest ./client

      - name: Push Frontend Docker Image
        run: |
          docker push kanavenavamshi/frontend:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check Kubernetes Cluster
        run: |
          kubectl get nodes

      - name: Deploy Frontend
        run: |
          kubectl apply -f client/kubernetes-files/frontend-deploy-service.yml

      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
            frontend=kanavenavamshi/frontend:latest

      - name: Wait for Frontend Deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Verify Frontend
        run: |
          kubectl get pods
          kubectl get services
          kubectl get deployment frontend
