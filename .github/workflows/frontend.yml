name: Frontend CI/CD to EKS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build \
            -t kanavenavamshi/frontend:${{ github.sha }} \
            -t kanavenavamshi/frontend:latest \
            ./client

      - name: Push Frontend Image
        run: |
          docker push kanavenavamshi/frontend:${{ github.sha }}
          docker push kanavenavamshi/frontend:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::364410975057:role/OIDC-12
          role-session-name: GitHubActions
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name naresh

      - name: Test EKS Connection
        run: |
          kubectl get nodes

      - name: Check Kubernetes Files
        run: |
          ls -la
          ls -la kubernetes-files
          cat kubernetes-files/frontend-deploy-service.yaml

      - name: Deploy Frontend
        run: |
          kubectl apply -f ./kubernetes-files/frontend-deploy-service.yaml

      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
            frontend=kanavenavamshi/frontend:${{ github.sha }}

      - name: Wait for Frontend Deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services
