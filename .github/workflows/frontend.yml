name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Frontend Docker Image
      - name: Build Frontend Docker Image
        run: |
          docker build -t kanavenavamshi/frontend:latest ./client

      # 4. Push Frontend Image to Docker Hub
      - name: Push Frontend Docker Image
        run: |
          docker push kanavenavamshi/frontend:latest

      # 5. Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # 6. Configure Kubernetes
      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # 7. Check Kubernetes Connection
      - name: Check Kubernetes Cluster
        run: |
          kubectl get nodes

      # 8. Deploy Frontend
      - name: Deploy Frontend
        run: |
          kubectl apply -f client/kubernetes-files/frontend-deploy-service.yml

      # 9. Update Frontend Image
      - name: Update Frontend Image
        run: |
          kubectl set image deployment/frontend \
            frontend=kanavenavamshi/frontend:latest

      # 10. Wait for Deployment
      - name: Wait for Frontend Deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s

      # 11. Verify Deployment
      - name: Verify Frontend
        run: |
          kubectl get pods
          kubectl get services
          kubectl get deployment frontend
