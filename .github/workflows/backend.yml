name: Backend CI/CD

on:
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t kanavenavamshi/backend:latest ./backend

      - name: Push Docker image
        run: |
          docker push kanavenavamshi/backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull kanavenavamshi/backend:latest

            docker stop backend || true
            docker rm backend || true

            docker run -d \
              --name backend \
              -p 8089:8080 \
              -e DB_HOST=books-rds.cux0w262wytu.us-east-1.rds.amazonaws.com \
              -e PORT=3306 \
              -e DB_USER=admin \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME=booksapp \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_EXPIRES_IN=7d \
              kanavenavamshi/backend:latest
